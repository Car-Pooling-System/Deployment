deployment:
  strategy: sequential
  order:
    - backend
    - frontend_web
    - frontend_mobile
  
  environments:
    staging:
      auto_deploy: true
      branch: develop
      notifications: true
    
    production:
      auto_deploy: false
      branch: main
      require_approval: true
      notifications: true

  timeouts:
    backend: 300s
    frontend: 600s
    mobile: 900s
